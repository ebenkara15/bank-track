[tool.poetry]
name = "bank-track"
version = "1.0.0"
description = "The Bank Track project giving access to your personal transactions & account balance"
authors = ["ebenkara15 <erwan.benkara@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "bank_track"}]

[tool.poetry.dependencies]
python = "^3.11, <3.13"
pydantic = "^2.5.3"
psycopg2 = "^2.9.9"
requests = "^2.31.0"
loguru = "^0.7.2"
fastapi = "^0.115.12"
uvicorn = {extras = ["standard"], version = "^0.26.0"}
pydantic-settings = "^2.1.0"
email-validator = "<2.1"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.40"}
pydantic-extra-types = "^2.4.1"
pycountry = "^23.12.11"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
dagster = "^1.7.2"
dagster-webserver = "^1.7.2"
alembic = "^1.13.1"
duckdb = "^1.0.0"
mkdocstrings = {extras = ["python"], version = "^0.29.1"}
asyncpg = "^0.30.0"
asyncer = "^0.0.8"
httpx = "^0.27.0"
ruff = "^0.11.8"

[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
black = "^23.12.1"
pytest = "^7.4.4"
requests-mock = "^1.12.1"
pytest-cov = "^5.0.0"
mypy = "^1.10.1"
types-python-jose = "^3.4.0.20250224"
mkdocs-material = "^9.6.11"
griffe-pydantic = "^1.1.4"
factory-boy = "^3.3.3"
deprecated = "^1.2.18"

[tool.ruff]
target-version = "py311"

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

# Same as Black.
line-length = 88
indent-width = 4

[tool.ruff.lint]
extend-select = ["FAST"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.dagster]
module_name = "deployment.dagster"

[tool.isort]
skip = ["__init__.py"]
profile = "black"
line_length = 90

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests/"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
