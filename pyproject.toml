[tool.poetry]
name = "bank-track"
version = "0.1.0"
description = "The Bank Track project giving access to your personal transactions & account balance"
authors = ["ebenkara15 <erwan.benkara@gmail.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "bank_track"}]

[tool.poetry.dependencies]
python = "^3.11, <3.13"
pydantic = "^2.5.3"
psycopg2 = "^2.9.9"
requests = "^2.31.0"
loguru = "^0.7.2"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.26.0"}
pydantic-settings = "^2.1.0"
email-validator = "<2.1"
sqlalchemy = "2.0.16"
pydantic-extra-types = "^2.4.1"
pycountry = "^23.12.11"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
dagster = "^1.7.2"
dagster-webserver = "^1.7.2"
alembic = "^1.13.1"
duckdb = "^1.0.0"
mkdocstrings = {extras = ["python"], version = "^0.29.1"}

[tool.poetry.group.dev.dependencies]
isort = "^5.13.2"
black = "^23.12.1"
pytest = "^7.4.4"
httpx = "^0.27.0"
ruff = "^0.4.1"
requests-mock = "^1.12.1"
pytest-cov = "^5.0.0"
mypy = "^1.10.1"
types-python-jose = "^3.4.0.20250224"
mkdocs-material = "^9.6.11"
griffe-pydantic = "^1.1.4"
factory-boy = "^3.3.3"


[tool.dagster]
module_name = "deployment.dagster"

[tool.isort]
skip = ["__init__.py"]
profile = "black"
line_length = 90

[tool.mypy]
plugins = ['pydantic.mypy']

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests/"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
